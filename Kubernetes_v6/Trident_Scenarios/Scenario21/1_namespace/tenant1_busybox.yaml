apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mydata
  namespace: tenant1
  labels:
    app: busybox
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: storage-class-tenant1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox
  namespace: tenant1
  labels:
    app: busybox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      nodeSelector:
        tenant-namespace: tenant1
      tolerations:
      - key: tenant-namespace
        operator: Equal
        value: tenant1
        effect: NoSchedule
      containers:
      - name: busybox
        image: registry.demo.netapp.com/busybox:1.35.0
        imagePullPolicy: IfNotPresent
        command: ['sleep', '3600']        
        volumeMounts:
        - mountPath: /data
          name: volume
      volumes:
      - name: volume
        persistentVolumeClaim:
          claimName: mydata
