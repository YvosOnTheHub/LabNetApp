apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mydata4
  namespace: tenant1
  labels:
    app: busybox4
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: storage-class-tenant1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox4
  namespace: tenant1
  labels:
    app: busybox4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox4
  template:
    metadata:
      labels:
        app: busybox4
    spec:
      containers:
      - name: busybox4
        image: registry.demo.netapp.com/busybox:1.35.0
        imagePullPolicy: IfNotPresent
        command: ['sleep', '3600']        
        volumeMounts:
        - mountPath: /data
          name: volume
      volumes:
      - name: volume
        persistentVolumeClaim:
          claimName: mydata4
