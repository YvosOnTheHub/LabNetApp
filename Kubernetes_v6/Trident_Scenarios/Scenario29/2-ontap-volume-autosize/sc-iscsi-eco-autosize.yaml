apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-class-iscsi-economy-autosize
provisioner: csi.trident.netapp.io
parameters:
  backendType: "ontap-san-economy"
  storagePools: "BackendForiSCSIEcoAutosize:aggr1"
  fsType: "ext4"
mountOptions:
   - discard
allowVolumeExpansion: true
