apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-class-iscsi-autosize
provisioner: csi.trident.netapp.io
parameters:
  backendType: "ontap-san"
  sanType: "iscsi"
  fsType: "ext4"
  storagePools: "BackendForiSCSIAutosize:.*"
mountOptions:
   - discard
allowVolumeExpansion: true
