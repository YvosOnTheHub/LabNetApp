apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mydata2
  namespace: s29-both
  labels:
    app.kubernetes.io/name: scenario29
    app: busybox2
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: storage-class-iscsi-economy-both
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox2
  namespace: s29-both
  labels:
    app.kubernetes.io/name: scenario29
    app: busybox2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scenario29
      app: busybox2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scenario29
        app: busybox2
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: busybox
        image: registry.demo.netapp.com/busybox:1.35.0
        imagePullPolicy: IfNotPresent
        command: ['sleep', '3600']
        volumeMounts:
        - mountPath: /data
          name: volume
      volumes:
      - name: volume
        persistentVolumeClaim:
          claimName: mydata2
