apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: alpine-vm2
  namespace: share
  labels:
    kubevirt.io/vm: alpine-vm2
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/vm: alpine-vm2
    spec:
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 256Mi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: shareddisk
              disk:
                bus: virtio
              shareable: true
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: alpine-boot-vm2
        - name: shareddisk
          persistentVolumeClaim:
            claimName: shared-block
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              runcmd:
                - echo "alpine:alpine" | chpasswd
                - echo 'Welcome to alpine-vm2 (shareable disk) in the NetApp LoD!' > /etc/motd
                - apk add --no-cache lsblk
