apiVersion: protect.trident.netapp.io/v1
kind: ExecHook
metadata:
  name: mysql-snap-pre
  namespace: alpinedb
spec:
  applicationRef: alpinedb
  stage: Pre
  action: Snapshot
  enabled: true
  hookSource: 
  timeout: 2
  arguments:
    - pre
  matchingCriteria:
    - type: podLabel
      value: kubevirt.io=virt-launcher
    - type: containerName
      value: compute
